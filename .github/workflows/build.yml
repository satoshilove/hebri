# Build and release the Hebri desktop app for every supported OS.
#
# Pulls from main produce downloadable CI artifacts. A tag such as v0.18.0
# additionally creates a GitHub Release after verifying that the tag matches
# apps/desktop/package.json.

name: Build & Release Hebri Desktop

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hebri-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 1

jobs:
  validate-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require tag to match desktop package version
        shell: bash
        run: |
          expected="v$(node -p "require('./apps/desktop/package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Release tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($expected)" >&2
            exit 1
          }

  windows:
    needs: [validate-version]
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build Windows installers (NSIS + MSI)
        working-directory: apps/desktop
        run: npm run dist:win -- --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=16384
      - name: List artifacts
        working-directory: apps/desktop
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|msi|blockmap)$' } | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hebri-windows
          path: |
            apps/desktop/release/Hebri-*-win-*.exe
            apps/desktop/release/Hebri-*-win-*.msi
            apps/desktop/release/Hebri-*-win-*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  macos:
    needs: [validate-version]
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact-name: hebri-macos-arm64
          - os: macos-15-intel
            artifact-name: hebri-macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build macOS installers (DMG + ZIP)
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          NODE_OPTIONS: --max-old-space-size=16384
        run: npm run dist:mac -- --publish never
      - name: List artifacts
        working-directory: apps/desktop
        run: ls -lh release/*.dmg release/*.zip 2>/dev/null || ls -lh release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/release/Hebri-*-mac-*.dmg
            apps/desktop/release/Hebri-*-mac-*.zip
          if-no-files-found: error

  linux:
    needs: [validate-version]
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build Linux packages (AppImage + DEB + RPM)
        working-directory: apps/desktop
        run: npm run dist:linux -- --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=16384
      - name: List artifacts
        working-directory: apps/desktop
        run: ls -lh release/Hebri-* || ls -lh release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hebri-linux
          path: |
            apps/desktop/release/Hebri-*-linux*.AppImage
            apps/desktop/release/Hebri-*-linux*.deb
            apps/desktop/release/Hebri-*-linux*.rpm
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error

  release:
    permissions:
      contents: write
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: hebri-*
          merge-multiple: true
          path: artifacts
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd artifacts
          shopt -s nullglob
          files=(Hebri-* latest*.yml)
          test "${#files[@]}" -gt 0 || {
            echo "No release artifacts found for checksumming" >&2
            exit 1
          }
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            artifacts/Hebri-*
            artifacts/latest*.yml
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
