name: Build Hebri Desktop

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'apps/desktop/**'
      - 'apps/shared/**'
      - 'scripts/install.*'
      - 'package*.json'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            artifact-name: hebri-linux-x64
          - os: macos-15
            target: mac
            artifact-name: hebri-macos-arm64
          - os: macos-15-intel
            target: mac
            artifact-name: hebri-macos-x64
          - os: windows-2025
            target: win
            artifact-name: hebri-windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea436ba5d5c88cb3b1f8 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.22.0
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Typecheck desktop
        run: npm run typecheck --workspace apps/desktop
      - name: Build ${{ matrix.target }} packages
        run: npm run dist:${{ matrix.target }} --workspace apps/desktop -- --publish never
        env:
          NODE_OPTIONS: --max-old-space-size=16384
      - name: Upload Linux packages
        if: matrix.target == 'linux'
        uses: actions/upload-artifact@b735583dc54e0f2c92bb457f8e3706b6807f16f8 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
          if-no-files-found: error
      - name: Upload macOS packages
        if: matrix.target == 'mac'
        uses: actions/upload-artifact@b735583dc54e0f2c92bb457f8e3706b6807f16f8 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
          if-no-files-found: error
      - name: Upload Windows packages
        if: matrix.target == 'win'
        uses: actions/upload-artifact@b735583dc54e0f2c92bb457f8e3706b6807f16f8 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.blockmap
          if-no-files-found: error
