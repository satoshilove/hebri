name: Build & Release Hebri Desktop

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            artifact-ext: AppImage
            artifact-name: hebri-linux-x64
          - os: macos-15
            target: mac
            artifact-ext: dmg
            artifact-name: hebri-mac-arm64
          - os: windows-2025
            target: win
            artifact-ext: msi
            artifact-name: hebri-win-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci
        working-directory: apps/desktop

      - name: Build ${{ matrix.target }}
        run: npm run dist:${{ matrix.target }}
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=16384

      - name: Collect artifacts
        shell: bash
        run: |
          cd apps/desktop/release
          mkdir -p ../collect
          for f in *.${{ matrix.artifact-ext }} *.deb *.rpm *.zip 2>/dev/null; do
            [ -f "$f" ] && cp "$f" "../collect/"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: apps/desktop/collect/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hebri-*
          merge-multiple: true
          path: release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
