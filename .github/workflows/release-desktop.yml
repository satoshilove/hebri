# Release Desktop — package the Hebri desktop app for every OS.
#
#   * Windows: NSIS exe + MSI   (built on windows-latest)
#   * macOS:   DMG + ZIP        (Apple Silicon + Intel; signed when CSC_LINK
#     is configured and notarized when the APPLE_API_* secrets are configured)
#   * Linux:   AppImage + DEB + RPM (built on ubuntu-latest)
#
# Trigger:
#   * "Run workflow" from the Actions tab (artifacts only), or
#   * push a tag like `v0.18.0` (artifacts + a GitHub Release).
#
# SECURITY: no `secrets: inherit`; no GitHub App credentials. The release
# job only needs `contents: write` to attach artifacts to the tag release.
#
# The desktop app bootstraps the agent runtime (Python venv + stages) at
# first launch from the pinned source — the installers themselves are
# self-contained Electron bundles, so no Python toolchain is needed in CI.

name: Release Desktop

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 1

jobs:
  validate-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea436ba5d5c88cb3b1f8 # v6
      - name: Require tag to match desktop package version
        shell: bash
        run: |
          expected="v$(node -p "require('./apps/desktop/package.json').version")"
          test "$GITHUB_REF_NAME" = "$expected" || {
            echo "Release tag $GITHUB_REF_NAME does not match apps/desktop/package.json ($expected)" >&2
            exit 1
          }

  windows:
    needs: [validate-version]
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea436ba5d5c88cb3b1f8 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build Windows installers (NSIS + MSI)
        working-directory: apps/desktop
        run: npm run dist:win -- --publish never
      - name: List artifacts
        working-directory: apps/desktop
        run: |
          Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|msi|blockmap)$' } | ForEach-Object { Write-Host "$($_.Name)  $([math]::Round($_.Length/1MB,1)) MB" }
      - uses: actions/upload-artifact@b735583dc54e0f2c92bb457f8e3706b6807f16f8 # v4
        with:
          name: hebri-windows
          path: |
            apps/desktop/release/Hebri-*-win-*.exe
            apps/desktop/release/Hebri-*-win-*.msi
            apps/desktop/release/Hebri-*-win-*.exe.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error

  macos:
    needs: [validate-version]
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact-name: hebri-macos-arm64
          - os: macos-15-intel
            artifact-name: hebri-macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea436ba5d5c88cb3b1f8 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build macOS installers (DMG + ZIP)
        # Electron-builder imports the Developer ID certificate from CSC_LINK.
        # notarize.mjs submits with the App Store Connect API key trio and is a
        # deliberate no-op when those secrets are absent.
        working-directory: apps/desktop
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: npm run dist:mac -- --publish never
      - name: List artifacts
        working-directory: apps/desktop
        run: ls -lh release/*.dmg release/*.zip 2>/dev/null || ls -lh release/
      - uses: actions/upload-artifact@b735583dc54e0f2c92bb457f8e3706b6807f16f8 # v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            apps/desktop/release/Hebri-*-mac-*.dmg
            apps/desktop/release/Hebri-*-mac-*.zip
          if-no-files-found: error

  linux:
    needs: [validate-version]
    if: always() && (needs.validate-version.result == 'success' || needs.validate-version.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea436ba5d5c88cb3b1f8 # v6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26
          cache: npm
      - name: Install workspace dependencies
        run: npm ci
      - name: Build Linux packages (AppImage + DEB + RPM)
        working-directory: apps/desktop
        run: npm run dist:linux -- --publish never
      - name: List artifacts
        working-directory: apps/desktop
        run: ls -lh release/Hebri-* || ls -lh release/
      - uses: actions/upload-artifact@b735583dc54e0f2c92bb457f8e3706b6807f16f8 # v4
        with:
          name: hebri-linux
          path: |
            apps/desktop/release/Hebri-*-linux*.AppImage
            apps/desktop/release/Hebri-*-linux*.deb
            apps/desktop/release/Hebri-*-linux*.rpm
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error

  # Tag-triggered: bundle the three platform artifacts into one GitHub Release.
  release:
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@634f935c9879cb72177639ff1a4cec03c4b16535 # v4
        id: download
        with:
          merge-multiple: true
          path: artifacts
      - name: Show collected artifacts
        run: ls -lh artifacts/
      - uses: softprops/action-gh-release@278a202770e73151112f8a970e8ad7e0c6d4ca14 # v2
        with:
          files: |
            artifacts/Hebri-*
            artifacts/latest*.yml
          generate_notes: true
